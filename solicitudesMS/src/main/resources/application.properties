spring.application.name=solicitudesMS
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/rutalimpia_solicitudes_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Evita mantener la sesion JPA abierta durante toda la peticion HTTP.
spring.jpa.open-in-view=false